# Site GitHub Pages : accueil + guide (dossier site/) et l'application web dans app/.
# Rien à installer pour l'utilisateur : https://<compte>.github.io/<dépôt>/ puis « Ouvrir l'application ».
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Identifiants d'application (publics) pour Drive / OneDrive / Dropbox, à définir dans
          # Settings → Secrets and variables → Actions → Variables (facultatif)
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          VITE_DROPBOX_CLIENT_ID: ${{ vars.VITE_DROPBOX_CLIENT_ID }}
      - name: Assembler le site (accueil, guide, application)
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp public/icon.svg _site/icon.svg
          cp -r dist _site/app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
