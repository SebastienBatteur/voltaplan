# Site GitHub Pages : accueil + guide (dossier site/) et l'application web dans app/.
# Rien à installer pour l'utilisateur : https://<compte>.github.io/<dépôt>/ puis « Ouvrir l'application ».
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: Pages

on:
  push:
    branches: [main]
    # Tout ce qui change le site publié (site/, application : src/, public/, index.html, dépendances,
    # configuration de construction) déclenche la publication. Sont exclus : documentation interne,
    # fichiers .md, tests, application de bureau et autres workflows. Les motifs sont lus dans l'ordre,
    # le dernier qui correspond l'emporte ; un changement mixte qui touche un fichier publié déclenche.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!test/**'
      - '!src-tauri/**'
      - '!.github/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Une seule publication à la fois, SANS annuler celle en cours : interrompre deploy-pages en plein
  # déploiement peut laisser le site dans un état intermédiaire ou faire échouer la publication suivante.
  # Les exécutions en attente sont remplacées par la plus récente (seul le dernier état de main compte).
  group: pages
  cancel-in-progress: false

jobs:
  # Construction et publication séparées (schéma officiel) : l'artefact est complet avant la publication,
  # ce qui évite l'erreur intermittente « No artifacts named github-pages were found ».
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages lit la configuration du site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Identifiants d'application (publics) pour Drive / OneDrive / Dropbox, à définir dans
          # Settings → Secrets and variables → Actions → Variables (facultatif)
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID }}
          VITE_DROPBOX_CLIENT_ID: ${{ vars.VITE_DROPBOX_CLIENT_ID }}
      - name: Assembler le site (accueil, guide, application)
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp public/icon.svg _site/icon.svg
          cp -r dist _site/app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publication GitHub Pages : seules permissions d'écriture nécessaires
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
