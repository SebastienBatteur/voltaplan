# Analyse de sécurité du code (CodeQL) : à chaque push sur main, chaque pull request et chaque semaine.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      # Dépôt privé sans « code scanning » (GitHub Advanced Security) : les résultats ne peuvent pas être envoyés
      # à l'onglet Security. Ils sont joints au run (fichier SARIF) et le job échoue s'il y a une alerte.
      # Quand le code scanning est activé (dépôt public, ou GHAS), remplacer `upload: never` par `upload: always`.
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
      - name: Alertes CodeQL (hors exceptions justifiées dans .github/codeql-accepted.txt)
        run: |
          jq -r '.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri)"' codeql-results/*.sarif | sort -u > alerts.txt
          grep -v '^#' .github/codeql-accepted.txt | grep -v '^\s*$' | sort -u > accepted.txt
          comm -23 alerts.txt accepted.txt > new.txt
          echo "Alertes : $(wc -l < alerts.txt), acceptées : $(comm -12 alerts.txt accepted.txt | wc -l), nouvelles : $(wc -l < new.txt)"
          cat new.txt
          test ! -s new.txt
