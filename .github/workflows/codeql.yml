# Analyse de sécurité du code (CodeQL) : à chaque push sur main et chaque demande de fusion qui touchent
# du code JavaScript / TypeScript (ou les dépendances), chaque semaine sur tout le code, et à la demande.
# Pas sur un changement de documentation seule (rien à analyser).
name: CodeQL

on:
  push:
    branches: [main]
    # Liste identique pour pull_request ci-dessous (pas d'ancre YAML, par prudence).
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codeql.yml'
      - '.github/codeql-accepted.txt'
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/codeql.yml'
      - '.github/codeql-accepted.txt'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      # Dépôt public : les résultats sont publiés dans l'onglet Security (code scanning) ET joints au run (fichier SARIF) ;
      # le job échoue s'il y a une alerte non justifiée dans .github/codeql-accepted.txt.
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
          upload: always
          output: codeql-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
      - name: Alertes CodeQL (hors exceptions justifiées dans .github/codeql-accepted.txt)
        run: |
          jq -r '.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri)"' codeql-results/*.sarif | sort -u > alerts.txt
          grep -v '^#' .github/codeql-accepted.txt | grep -v '^\s*$' | sort -u > accepted.txt
          comm -23 alerts.txt accepted.txt > new.txt
          echo "Alertes : $(wc -l < alerts.txt), acceptées : $(comm -12 alerts.txt accepted.txt | wc -l), nouvelles : $(wc -l < new.txt)"
          cat new.txt
          test ! -s new.txt
