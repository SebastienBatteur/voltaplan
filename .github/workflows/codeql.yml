# Analyse de sécurité du code (CodeQL) : à chaque push sur main, chaque pull request et chaque semaine.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      # Dépôt privé sans « code scanning » (GitHub Advanced Security) : les résultats ne peuvent pas être envoyés
      # à l'onglet Security. Ils sont joints au run (fichier SARIF) et le job échoue s'il y a une alerte.
      # Quand le code scanning est activé (dépôt public, ou GHAS), remplacer `upload: never` par `upload: always`.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
      - name: Alertes CodeQL
        run: |
          n=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          echo "Alertes CodeQL : $n"
          jq -r '.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif
          test "$n" -eq 0
