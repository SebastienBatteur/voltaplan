# Construction de l'application de bureau (Tauri) SANS publication : vérifie que le code Rust compile
# et que les paquets se fabriquent sur Windows, macOS et Linux. Aucune release, aucun envoi :
# les paquets et le Cargo.lock résolu sont seulement déposés en « artifacts » du run (7 jours).
# La publication reste dans release.yml (tag « v* »).
#
# Coût : macOS compte ×10 et Windows ×2 sur un dépôt privé [à vérifier]. D'où :
#  - déclenchement seulement si src-tauri/, package.json, package-lock.json ou ce workflow changent ;
#  - un premier job Linux de quelques secondes (« pertinence ») qui, quand seuls package.json /
#    package-lock.json ont changé, ne lance la construction que si la modification touche un paquet Tauri
#    (@tauri-apps/*, dont la version doit rester alignée sur les crates) ; les mises à jour d'outils de
#    développement (Dependabot) ne relancent donc pas trois constructions natives.
name: Desktop build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yml'
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  pertinence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Pas de pipefail : « grep -q » ferme le tube dès la première correspondance, ce qui ferait échouer
          # la commande précédente (SIGPIPE) et inverserait le test.
          set -eu
          decide() { echo "build=$1" >> "$GITHUB_OUTPUT"; echo "Construction : $1 ($2)"; }
          if [ "$EVENT" = "workflow_dispatch" ]; then decide true "lancement manuel"; exit 0; fi
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE...$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            decide true "historique du push inconnu"; exit 0
          else
            RANGE="$BEFORE..$AFTER"
          fi
          FILES=$(git diff --name-only "$RANGE")
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(src-tauri/|\.github/workflows/desktop-build\.yml$)'; then
            decide true "src-tauri ou workflow modifié"; exit 0
          fi
          if git diff "$RANGE" -- package.json package-lock.json | grep -E '^[-+]' | grep -qi 'tauri'; then
            decide true "paquet Tauri modifié"; exit 0
          fi
          decide false "dépendances modifiées sans paquet Tauri"

  build:
    needs: pertinence
    if: needs.pertinence.outputs.build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: macos-latest
            name: macos-arm64
          - platform: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Si un Cargo.lock est versionné, il doit être à jour (échec si cargo devait le modifier).
      - name: Cargo.lock à jour
        if: hashFiles('src-tauri/Cargo.lock') != ''
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 > /dev/null
        shell: bash

      - name: Construction (tauri build)
        run: npx tauri build
        shell: bash

      # Tests Rust (écriture atomique, src-tauri/src/atomic_save.rs) sur chaque plateforme : le comportement de
      # std::fs::rename diffère entre Windows et Unix. Après la construction (dist/ doit exister pour generate_context!).
      - name: Tests Rust (cargo test)
        working-directory: src-tauri
        run: cargo test --locked --lib
        shell: bash

      - name: Cargo.lock résolu (artifact)
        if: always() && matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 7

      - name: Paquets (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: voltaplan-desktop-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 7
