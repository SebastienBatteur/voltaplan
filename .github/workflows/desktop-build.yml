# Construction de l'application de bureau (Tauri) SANS publication : vérifie que le code Rust compile
# et que les paquets se fabriquent sur Windows, macOS et Linux. Aucune release, aucun envoi :
# les paquets et le Cargo.lock résolu sont seulement déposés en « artifacts » du run (7 jours).
# La publication reste dans release.yml (tag « v* »).
name: Desktop build

on:
  workflow_dispatch:
  # TEMPORAIRE (vérification de la branche, à retirer avant fusion)
  push:
    branches: ['worktree-agent-ab851763ebd9da010']
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: macos-latest
            name: macos-arm64
          - platform: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Si un Cargo.lock est versionné, il doit être à jour (échec si cargo devait le modifier).
      - name: Cargo.lock à jour
        if: hashFiles('src-tauri/Cargo.lock') != ''
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 > /dev/null
        shell: bash

      - name: Construction (tauri build)
        run: npx tauri build
        shell: bash

      - name: Cargo.lock résolu (artifact)
        if: always() && matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 7

      - name: Paquets (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: voltaplan-desktop-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 7
