# Paquets installables de l'application de bureau (Tauri) :
#  - Windows : installateur .msi et .exe (NSIS)
#  - macOS   : .dmg (Apple Silicon et Intel)
#  - Linux   : .AppImage, .deb et .rpm
# Lancement : pousser un tag « v0.2.0 » (crée une release brouillon sur GitHub avec les paquets),
# ou à la main depuis l'onglet Actions (paquets disponibles en « artifacts » du run).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Jamais d'annulation : une release interrompue laisserait une release brouillon incomplète.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Création de la release brouillon et envoi des paquets ; attestations de provenance (dépôt public : gratuit)
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            name: windows
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macos-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macos-x64
          - platform: ubuntu-22.04
            args: ''
            name: linux
    runs-on: ${{ matrix.platform }}
    # Garde-fou contre un job bloqué (les constructions normales prennent bien moins)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm test

      - name: Arbre Git propre (release officielle)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; echo "Modifications non commitées : publication refusée"; exit 1; fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Voltaplan ${{ github.ref_name }}'
          releaseBody: 'Paquets installables pour Windows, macOS et Linux. Voir le README pour les instructions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Paquets (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: voltaplan-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 30

      # SBOM de l'application de bureau (dépendances Rust et Tauri), une fois (Linux) : cargo metadata, rien à installer
      - name: SBOM bureau (CycloneDX)
        if: matrix.name == 'linux' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo metadata --format-version 1 --locked --manifest-path src-tauri/Cargo.toml > cargo-metadata.json
          npm run provenance -- sbom-cargo cargo-metadata.json sbom-desktop.cdx.json
          gh release upload "${{ github.ref_name }}" sbom-desktop.cdx.json --clobber

      # Attestation de provenance (in-toto / SLSA, signée par GitHub) des paquets : vérifiable avec
      # « gh attestation verify <fichier> --repo <dépôt> ». Gratuit pour un dépôt public ; ignoré sinon.
      - name: Attestation de provenance (paquets)
        if: startsWith(github.ref, 'refs/tags/') && !github.event.repository.private
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm

  # Version web d'une release : vérifications bloquantes, compilation reproductible, empreintes, SBOM, sommes,
  # attestation. Tags seulement (aucun coût sur les autres exécutions). Le brouillon de release est créé par « build ».
  web-provenance:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Arbre Git propre
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; exit 1; fi
      - run: npm run build
      - name: Vérifications de release (commit, version du tag, code source accessible)
        run: npm run provenance -- verify dist --release --commit "$GITHUB_SHA" --version "${GITHUB_REF_NAME#v}"
      - name: Compilation reproductible (deuxième compilation, même identifiant de contenu)
        run: |
          mv dist dist-1
          npm run build
          a=$(node -p "require('./dist-1/build-info.json').build.id")
          b=$(node -p "require('./dist/build-info.json').build.id")
          echo "1 : $a"; echo "2 : $b"
          test "$a" = "$b"
      - name: Artefacts de provenance
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p out
          (cd dist && zip -qr -X "../out/voltaplan-web-$V.zip" .)
          cp dist/build-info.json "out/build-info-$V.json"
          cp dist/fingerprints.json "out/fingerprints-$V.json"
          cp dist/THIRD-PARTY-LICENSES.txt "out/THIRD-PARTY-LICENSES-web-$V.txt"
          npm sbom --sbom-format cyclonedx --omit dev > "out/sbom-web-$V.cdx.json"
          npm run provenance -- sums out SHA256SUMS
          mv SHA256SUMS out/
      - name: Attestation de provenance (version web et métadonnées)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - name: Ajout à la release brouillon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber
