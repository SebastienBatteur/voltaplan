# Mises à jour des dépendances, chaque semaine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Versions majeures (React 19, Vite, Vitest, zustand 5…) : migration à faire à la main, pas de demande automatique.
    # Les alertes de sécurité (Dependabot security updates) restent actives indépendamment de ce réglage.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      # Paquets Tauri ensemble : les plugins npm doivent garder la même version majeure.mineure que les crates
      # (tauri build refuse sinon). La mise à jour cargo correspondante arrive dans la demande « cargo » ci-dessous.
      tauri:
        patterns: ['@tauri-apps/*']
      # Outils de développement regroupés pour limiter le nombre de demandes de fusion
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Versions majeures des actions : migration à la main, comme pour npm.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    # Cargo.lock versionné : les crates Tauri sont mises à jour ensemble, à fusionner avec la demande npm « tauri ».
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      tauri:
        patterns: ['tauri*']
      rust-dependencies:
        patterns: ['*']
