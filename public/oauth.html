<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Voltaplan — connexion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:15px system-ui,sans-serif;margin:40px;color:#1d2330;background:#f5f6f8}</style>
</head>
<body>
<p>Connexion terminée, vous pouvez fermer cette fenêtre.</p>
<script>
  // Renvoie la réponse du service (code ou jeton) à Voltaplan, sur la même origine uniquement.
  if (window.opener) {
    window.opener.postMessage({ type: 'voltaplan-oauth', search: location.search, hash: location.hash }, location.origin);
  }
</script>
</body>
</html>
